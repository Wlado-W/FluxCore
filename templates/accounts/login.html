{% extends "base.html" %}
{% block title %}Вход — FluxCore{% endblock %}

{% block content %}
<div class="auth-box">
    <h2>Вход в панель</h2>
    {% if form.errors %}
        <p class="auth-error">Неверный логин или пароль.</p>
    {% endif %}
    <form method="post">
        {% csrf_token %}
        <input type="hidden" name="next" value="{{ request.GET.next }}">
        <label>Логин</label>
        {{ form.username }}
        <label>Пароль</label>
        {{ form.password }}
        <button type="submit">Войти</button>
    </form>
</div>
{% endblock %}
