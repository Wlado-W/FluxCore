<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}FluxCore{% endblock %}</title>
    <link rel="stylesheet" href="/static/css/dashboard.css">
    {% if active_theme %}
    <style>
        :root {
            --bg: {{ active_theme.color_bg }};
            --surface: {{ active_theme.color_surface }};
            --border: {{ active_theme.color_border }};
            --text: {{ active_theme.color_text }};
            --text-muted: {{ active_theme.color_text_muted }};
            --accent: {{ active_theme.color_accent }};
            --online: {{ active_theme.color_online }};
            --offline: {{ active_theme.color_offline }};
            --error: {{ active_theme.color_error }};
        }
    </style>
    {% endif %}
    {% block extra_head %}{% endblock %}
</head>
<body>
    <nav class="topbar">
        <div class="topbar-brand">FluxCore</div>
        <div class="topbar-links">
            <a href="/">Дашборд</a>
            <a href="/admin/">Админка</a>
            {% if user.is_authenticated %}
            <a href="/accounts/logout/">Выйти</a>
            {% endif %}
        </div>
    </nav>
    <main class="content">
        {% block content %}{% endblock %}
    </main>
    {% block extra_scripts %}{% endblock %}
</body>
</html>
