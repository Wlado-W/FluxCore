{% extends "base.html" %}
{% load i18n %}
{% block title %}{% trans "Удалить inbound" %} — FluxCore{% endblock %}

{% block content %}
<div class="form-box">
    <h2>{% trans "Удалить inbound" %} «{{ inbound.tag }}»?</h2>
    <p class="fc-help-text">{% trans "Это действие необратимо." %}</p>
    <form method="post">
        {% csrf_token %}
        <div class="form-actions">
            <button type="submit" class="btn-danger">{% trans "Да, удалить" %}</button>
            <a href="{% url 'dashboard:inbound-list' %}" class="btn-secondary">{% trans "Отмена" %}</a>
        </div>
    </form>
</div>
{% endblock %}
