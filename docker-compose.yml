version: "3.9"

services:
  db:
    image: postgres:16
    env_file: .env
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7

  web:
    build: .
    command: gunicorn config.wsgi:application --bind 0.0.0.0:8000
    env_file: .env
    depends_on: [db, redis]
    ports:
      - "8000:8000"

  asgi:
    build: .
    command: uvicorn config.asgi:application --host 0.0.0.0 --port 8001
    env_file: .env
    depends_on: [db, redis]
    ports:
      - "8001:8001"

  celery_worker:
    build: .
    command: celery -A config worker -l info
    env_file: .env
    depends_on: [db, redis]

  celery_beat:
    build: .
    command: celery -A config beat -l info
    env_file: .env
    depends_on: [db, redis]

volumes:
  pgdata:
